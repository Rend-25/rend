<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rend — Professional Video Editing</title>
    <meta
      name="description"
      content="Rend is a video editing agency helping YouTube creators and businesses with high-quality long-form videos and Shorts that keep viewers engaged."
    />
    <meta name="theme-color" content="#000000" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rend — Professional Video Editing" />
    <meta
      property="og:description"
      content="High-quality long-form videos and Shorts that keep viewers engaged."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rend — Professional Video Editing" />
    <meta
      name="twitter:description"
      content="High-quality long-form videos and Shorts that keep viewers engaged."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #000000;
        --text: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background-color: #000000;
        color: #ffffff;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
      }

      ::selection {
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
      }

      .layout {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .backdrop {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(
          60% 50% at 50% 0%,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(0, 0, 0, 0) 70%
        );
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 6rem 1.5rem 4rem;
        text-align: center;
      }

      .eyebrow {
        margin-bottom: 1.5rem;
        font-size: 0.7rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.45em;
        color: rgba(255, 255, 255, 0.45);
      }

      .title {
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        font-size: clamp(4.5rem, 18vw, 13rem);
      }

      .heading {
        margin-top: 2.5rem;
        max-width: 48rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.2;
        font-size: clamp(1.5rem, 3.4vw, 2.6rem);
      }

      .description {
        margin-top: 1.5rem;
        max-width: 36rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.6);
        font-size: 1rem;
      }

      @media (min-width: 640px) {
        .description {
          font-size: 1.125rem;
        }
      }

      .cta {
        margin-top: 3rem;
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        border-radius: 9999px;
        background: #ffffff;
        padding: 1rem 2.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: #000000;
        text-decoration: none;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
          background-color 0.3s ease;
        will-change: transform;
      }

      .cta:hover {
        transform: scale(1.06);
      }

      .cta:active {
        transform: scale(1);
      }

      .cta:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 4px;
      }

      .cta .arrow {
        width: 1rem;
        height: 1rem;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .cta:hover .arrow {
        transform: translateX(0.125rem);
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
        text-align: center;
      }

      .footer-text {
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.35);
      }

      /* Scroll fade-in */
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
          transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .reveal[data-delay='1'] {
        transition-delay: 0.1s;
      }
      .reveal[data-delay='2'] {
        transition-delay: 0.25s;
      }
      .reveal[data-delay='3'] {
        transition-delay: 0.4s;
      }
      .reveal[data-delay='4'] {
        transition-delay: 0.55s;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .reveal {
          opacity: 1;
          transform: none;
          transition: none;
        }
        .cta,
        .cta .arrow {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="backdrop" aria-hidden="true"></div>

      <main>
        <p class="eyebrow reveal" data-delay="1">Video Editing Agency</p>

        <h1 class="title reveal" data-delay="1">Rend</h1>

        <h2 class="heading reveal" data-delay="2">
          Professional Video Editing for Your Videos
        </h2>

        <p class="description reveal" data-delay="3">
          We help YouTube creators and businesses with high-quality long-form
          videos and Shorts that keep viewers engaged.
        </p>

        <a
          class="cta reveal"
          data-delay="4"
          href="https://instagram.com/rend25072026"
          target="_blank"
          rel="noopener noreferrer"
        >
          Contact Us on Instagram
          <svg
            class="arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </a>
      </main>

      <footer>
        <p class="footer-text reveal">© 2026 Rend. All rights reserved.</p>
      </footer>
    </div>

    <script>
      (function () {
        'use strict';

        var revealEls = document.querySelectorAll('.reveal');

        if (!('IntersectionObserver' in window)) {
          for (var i = 0; i < revealEls.length; i++) {
            revealEls[i].classList.add('is-visible');
          }
          return;
        }

        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.15, rootMargin: '0px 0px -8% 0px' }
        );

        for (var i = 0; i < revealEls.length; i++) {
          observer.observe(revealEls[i]);
        }
      })();
    </script>
  </body>
</html>
